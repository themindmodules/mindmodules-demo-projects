<path d="M600 420V260" stroke="#9bbfae"/>
</g>
<g fill="#eafff4" font-size="20" text-anchor="middle" font-weight="700">
<text x="175" y="95">NUCLEO-F411RE</text>
<text x="540" y="95">DRV8871 board</text>
<text x="865" y="95">gear motor</text>
<text x="865" y="118" font-size="16" font-weight="400">with hall encoder</text>
<text x="540" y="452">12 V DC adapter</text>
</g>
<g fill="#9bbfae" font-size="15">
<text x="175" y="125" text-anchor="middle">PB4 (D5) TIM3_CH1</text>
<text x="175" y="165" text-anchor="middle">PB5 (D4) TIM3_CH2</text>
<text x="175" y="205" text-anchor="middle">GND (driver)</text>
<text x="175" y="285" text-anchor="middle">PA0 (A0) TIM2_CH1</text>
<text x="175" y="325" text-anchor="middle">PA1 (A1) TIM2_CH2</text>
<text x="175" y="365" text-anchor="middle">3V3</text>
<text x="175" y="405" text-anchor="middle">GND (encoder)</text>
<text x="175" y="470" text-anchor="middle" font-size="13">USB: power and serial 115200</text>
<text x="370" y="113" text-anchor="middle">IN1</text>
<text x="370" y="153" text-anchor="middle">IN2</text>
<text x="370" y="193" text-anchor="middle">GND</text>
<text x="540" y="150" text-anchor="middle">IN1 IN2 GND</text>
<text x="540" y="175" text-anchor="middle">OUT1 OUT2 to motor</text>
<text x="540" y="200" text-anchor="middle">VM 12 V, ILIM 30 kohm</text>
<text x="540" y="225" text-anchor="middle">100 uF across VM</text>
<text x="705" y="113" text-anchor="middle">M+</text>
<text x="705" y="153" text-anchor="middle">M-</text>
<text x="865" y="160" text-anchor="middle">motor + / motor -</text>
<text x="865" y="255" text-anchor="middle">encoder A</text>
<text x="865" y="295" text-anchor="middle">encoder B</text>
<text x="865" y="320" text-anchor="middle">encoder VCC 3.3 V</text>
<text x="865" y="345" text-anchor="middle">encoder GND</text>
<text x="510" y="345" text-anchor="middle">VM +12 V</text>
<text x="630" y="345" text-anchor="middle">GND</text>
<text x="540" y="480" text-anchor="middle">motor power only</text>
<text x="540" y="503" text-anchor="middle">all grounds joined</text>
</g>
<g fill="#ffb454" font-size="14">
<text x="40" y="546">Power the encoder from 3V3 so its A and B outputs never rise above 3.3 V. Join the adapter, driver and Nucleo grounds.</text>
</g>
